conky.config = {
    alignment = 'middle_right',
    background = false,
    update_interval = 2,
    double_buffer = true,
    no_buffers = true,
    own_window = true,
    own_window_type = 'desktop',
    own_window_transparent = false,
    own_window_argb_visual = true,
    own_window_argb_value = 150,
    own_window_colour = '#282828',
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    draw_shades = false,
    draw_outline = false,
    draw_borders = false,
    draw_graph_borders = false,
    use_xft = true,
    font = 'JetBrains Mono:size=11',
    minimum_width = 320,
    minimum_height = 260,
    gap_x = 20,
    gap_y = 20,
    border_inner_margin = 8,
    border_outer_margin = 8,
    cpu_avg_samples = 2,
    net_avg_samples = 2,
    override_utf8_locale = true,
    default_color = '#EBDBB2',
    color1 = '#B8BB26',
    color2 = '#83A598',
    color3 = '#FABD2F',
    color4 = '#928374',
};

conky.text = [[
${alignc}${font JetBrains Mono:bold:size=25}${color1}${time %H:%M:%S}${font}
${alignc}${color4}${time %A, %d %B %Y}${color}

${voffset 10}${color2}IP${color} $alignr ${execpi 60 bash -c "ip route get 1.1.1.1 2>/dev/null | awk '/src/{for(i=1;i<=NF;i++) if(\$i==\"src\") print \$(i+1)}'"}
${color2}Weather${color} $alignr ${execpi 1800 curl -ks --max-time 5 'https://wttr.in/Kolkata?format=%C+%t\nAir$alignr%w+\nPressure$alignr+%P\nHumidity$alignr+%h\nMoon+$alignr+%m\nSunrise$alignr+%S\nSunset$alignr+%s' || echo 'N/A'}

${font bold:size=9}${color2}CPU${color} ${cpu}% ${cpubar 8}
${color2}RAM${color} ${mem} / ${memmax} ${membar 8}
${font}
${color2}Temp${color} $alignr ${execpi 60 bash -c "sensors 2>/dev/null | awk '/Package id 0:|Tctl:|Tdie:/ {print \$4; exit}'"}

${color3}Top Memory Users${color} $alignr ${color4}CPU%   MEM%${color}
${top_mem name 1} $alignr${top_mem cpu 1}%   ${top_mem mem 1}%
${top_mem name 2} $alignr${top_mem cpu 2}%   ${top_mem mem 2}%
${top_mem name 3} $alignr${top_mem cpu 3}%   ${top_mem mem 3}%
${top_mem name 4} $alignr${top_mem cpu 4}%   ${top_mem mem 4}%

${color2}Location${color} $alignr ${color4}Time${color}
Sydney    $alignr ${tztime Australia/Sydney %H:%M:%S}
Dhaka     $alignr ${tztime Asia/Dhaka %H:%M:%S}
Islamabad $alignr ${tztime Asia/Karachi %H:%M:%S}
Madina    $alignr ${tztime Asia/Riyadh %H:%M:%S}

${voffset 10}${color2}Net${color} $alignr ${color1}↑${color} ${upspeed wlp3s0}   ${color3}↓${color} ${downspeed wlp3s0}
${color2}Uptime${color} $alignr $uptime
]];
